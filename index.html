<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>V1 Flight Planner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      background: #111c30;
      border-bottom: 1px solid #26344d;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      color: #8fa4c4;
      margin-top: 6px;
      font-size: 14px;
    }

    main {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: #111c30;
      border: 1px solid #26344d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      color: #8fa4c4;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #34435e;
      background: #0b1220;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2675ff;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2675ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .status {
      margin-top: 15px;
      color: #8fa4c4;
      font-size: 13px;
    }

    #result {
      display: none;
      margin-top: 20px;
    }

    .airport {
      background: #0b1220;
      border: 1px solid #26344d;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
      line-height: 1.6;
    }

    .airport-code {
      font-size: 22px;
      font-weight: bold;
    }

    .airport-name {
      font-size: 15px;
      margin-top: 3px;
    }

    .airport-location {
      color: #8fa4c4;
      font-size: 13px;
    }

    .route {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }

    .route-code {
      font-size: 20px;
      font-weight: bold;
    }

    .route-line {
      flex: 1;
      height: 2px;
      background: #2675ff;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid #26344d;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #8fa4c4;
    }

    .info-value {
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .inputs {
        grid-template-columns: 1fr;
      }

      main {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>✈️ V1 Flight Planner</h1>
  <p>Free flight planning system</p>
</header>

<main>

  <div class="card">

    <h2>Flight Setup</h2>

    <div class="inputs">

      <div>
        <label>Departure ICAO</label>

        <input
          id="departure"
          type="text"
          maxlength="4"
          placeholder="VABB"
          autocomplete="off"
        >
      </div>

      <div>
        <label>Destination ICAO</label>

        <input
          id="destination"
          type="text"
          maxlength="4"
          placeholder="VIDP"
          autocomplete="off"
        >
      </div>

    </div>

    <button onclick="planFlight()">
      PLAN FLIGHT
    </button>

    <div class="status" id="status">
      Loading airport database...
    </div>

  </div>


  <div class="card" id="result">

    <h2>Flight</h2>

    <div class="route">

      <span class="route-code" id="routeDeparture">
        ---
      </span>

      <div class="route-line"></div>

      <span class="route-code" id="routeDestination">
        ---
      </span>

    </div>


    <h2 style="margin-top:25px;">
      Departure
    </h2>

    <div class="airport">

      <div
        class="airport-code"
        id="depCode">
        ---
      </div>

      <div
        class="airport-name"
        id="depName">
        ---
      </div>

      <div
        class="airport-location"
        id="depLocation">
        ---
      </div>

    </div>


    <h2 style="margin-top:25px;">
      Destination
    </h2>

    <div class="airport">

      <div
        class="airport-code"
        id="destCode">
        ---
      </div>

      <div
        class="airport-name"
        id="destName">
        ---
      </div>

      <div
        class="airport-location"
        id="destLocation">
        ---
      </div>

    </div>

  </div>


  <div class="card">

    <h2>Flight Information</h2>

    <div class="info-row">
      <span class="info-label">Distance</span>
      <span class="info-value" id="distance">
        —
      </span>
    </div>

    <div class="info-row">
      <span class="info-label">Estimated Time</span>
      <span class="info-value">
        —
      </span>
    </div>

    <div class="info-row">
      <span class="info-label">Fuel</span>
      <span class="info-value">
        —
      </span>
    </div>

  </div>

</main>


<!-- Our flight-planning engine -->
<script src="app.js"></script>

</body>
</html>
